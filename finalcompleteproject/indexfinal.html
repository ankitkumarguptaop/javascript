<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascipt tutorial</title>

    <script src="jsfinal.js" defer></script>
    <!-- <script src="javascript2.js" defer></script> -->
    <!--best way to link javascript
    (here both javascript load and parsing of html done simulteniously 
     incase all js load but parsing is not done then we cannot execute it 
     firstly parsing is done the execute js  )--> 
     <!-- <script src="javascript.js" defer></script> --> 
    <link rel="stylesheet" href="cssfinal.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
          <h1 class="logo">Website</h1>
          <ul class="nav-items">
            <li class="nav-item"><a href="#home">Home</a></li>
            <li class="nav-item"><a href="">Todo</a></li>
            <li class="nav-item"><a href="">Sign Up</a></li>
          </ul>
        </nav>
        <div class="headline">
          <h2 id="main-heading">
            Manage your tasks 
          </h2>
          <button class="btn btn-headline">Learn More</button>
         

        </div>
      </header>
  
      <section class="section-todo container">
        <h2>Your plan for today ?</h2>
        <!-- todo form  -->
        <form class="form-todo">
          <input type="text" name="" id="new-id" placeholder="Add Todo" />
          <input type="submit" id="new-id1" value="Add Todo" class="btn" />
        </form>
  
        <ul class="todo-list">
          <!-- li{item $}*5  -->
        <li>
          <span class="text">do this</span>
          <div class="todo-buttons">
          <button class="todo-btn done">Done</button>
          <button class="todo-btn remove">Remove</button>
        </div>
        </li>
        </ul>
      </section>
  
      <section class="section-signup container">
        <h2>Sign Up</h2>
        <form class="signup-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" name="confirmPassword" id="confirmPassword" />
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" name="phone" id="phone" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" />
          </div>
          <div class="form-group">
            <label for="about">About Yourself</label>
            <textarea name="about" id="about" cols="30" rows="10"></textarea>
          </div>
          <button type="submit" class="btn signup-btn">Submit</button>
        </form>
      </section>

</body>
</html>
